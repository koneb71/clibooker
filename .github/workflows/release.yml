name: Release

# Builds the desktop app and the bk CLI for every platform into a draft GitHub release.
#
#   - Push a tag that matches the app version:  git tag v0.1.0 && git push origin v0.1.0
#   - or run it by hand: Actions → Release → Run workflow (uses the version in tauri.conf.json)
#
# Review the draft on GitHub, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag doesn't match the app version $version in app/src-tauri/tauri.conf.json"
              exit 1
            fi
          else
            tag=v$version
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # One draft for all the builds to upload into (drafts don't create the tag until published).
      - id: release
        name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          find_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Clibooker $TAG" --generate-notes
            id=$(find_id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    name: App (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Builds the bk sidecar (beforeBuildCommand) and the app, then uploads the installers
      # to the draft: .dmg, .deb/.rpm/.AppImage, .msi and the NSIS setup .exe.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.draft.outputs.release_id }}

  cli:
    name: bk CLI (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build -p bk-cli --release --locked --target ${{ matrix.target }}

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          name=bk-$TAG-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/bk README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bk-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bk.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" --clobber

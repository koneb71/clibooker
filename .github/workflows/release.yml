name: Release

# Builds the desktop app and the bk CLI for every platform into a draft GitHub release,
# signed for updates, with the `latest.json` that installed apps and `bk update` read.
#
#   - Push a tag that matches the app version:  git tag v0.1.0 && git push origin v0.1.0
#   - or run it by hand: Actions → Release → Run workflow (uses the version in tauri.conf.json)
#
# Review the draft on GitHub, then publish it: installed copies see it once it's published.
#
# Needs two repository secrets, the update signing key and its password
# (`pnpm tauri signer generate -w ~/.tauri/clibooker.key`):
#   TAURI_SIGNING_PRIVATE_KEY           the content of ~/.tauri/clibooker.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Its public half is `plugins.updater.pubkey` in app/src-tauri/tauri.conf.json (and
# RELEASE_PUBKEY in crates/bk-core/src/update.rs).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # Unsigned builds can't update anyone: stop before building them.
      - name: Signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret isn't set (see the top of release.yml)"
            exit 1
          fi
          if ! jq -e '.plugins.updater.pubkey | length > 0' app/src-tauri/tauri.conf.json >/dev/null; then
            echo "::error::plugins.updater.pubkey is empty in app/src-tauri/tauri.conf.json"
            exit 1
          fi

      - id: version
        name: Version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag doesn't match the app version $version in app/src-tauri/tauri.conf.json"
              exit 1
            fi
          else
            tag=v$version
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # One draft for all the builds to upload into (drafts don't create the tag until published).
      - id: release
        name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Reuse this version's release if there is one (e.g. re-running a build).
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            # Take the id from the response: the release list can lag behind a new draft.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Clibooker $TAG" \
              -F draft=true -F generate_release_notes=true --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::couldn't create or find the release for $TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    name: App (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Builds the bk sidecar (beforeBuildCommand) and the app, then uploads the installers
      # to the draft: .dmg, .deb/.rpm/.AppImage, .msi and the NSIS setup .exe, each with the
      # signed update package (`.app.tar.gz` on macOS) and its `.sig`. `latest.json` is
      # written once at the end (`updater` job): jobs writing it in parallel would race.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false

  cli:
    name: bk CLI (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build -p bk-cli --release --locked --target ${{ matrix.target }}

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          name=bk-$TAG-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/bk README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bk-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bk.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `bk update` checks this signature (and that it names this file and version).
      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.2 signer sign --app-version "${TAG#v}" "$ASSET"

      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sig" --clobber

  # What installed apps and `bk update` read: every update package with its signature, each
  # checked against the public key the apps trust (a mismatch would break everyone's updates).
  updater:
    name: latest.json
    needs: [draft, app, cli]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release
        run: |
          sudo apt-get install -y minisign
          gh release download "$TAG" --dir assets

      - name: Check every signature
        run: |
          jq -r .plugins.updater.pubkey app/src-tauri/tauri.conf.json | base64 -d > release.pub
          count=0
          for sig in assets/*.sig; do
            file=${sig%.sig}
            base64 -d "$sig" > "$file.minisig"
            if ! minisign -V -q -p release.pub -m "$file" -x "$file.minisig"; then
              echo "::error::$(basename "$file") isn't signed with the key in tauri.conf.json"
              exit 1
            fi
            count=$((count + 1))
          done
          bk=$(ls assets/bk-*.sig | wc -l)
          if [ "$bk" -ne 5 ]; then
            echo "::error::expected 5 signed bk archives, found $bk"
            exit 1
          fi
          echo "$count signatures check out"

      - name: Write latest.json
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            local file
            file=$(cd assets && ls $1 2>/dev/null | head -1)
            if [ -z "$file" ] || [ ! -f "assets/$file.sig" ]; then
              echo "::error::no signed $1 in the release" >&2
              return 1
            fi
            jq -n --arg url "$base/$file" --arg sig "$(cat "assets/$file.sig")" '{url: $url, signature: $sig}'
          }
          mac_arm=$(entry '*aarch64.app.tar.gz')
          mac_x64=$(entry '*x64.app.tar.gz')
          appimage=$(entry '*.AppImage')
          deb=$(entry '*.deb')
          rpm=$(entry '*.rpm')
          nsis=$(entry '*-setup.exe')
          msi=$(entry '*.msi')
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac_arm "$mac_arm" --argjson mac_x64 "$mac_x64" --argjson appimage "$appimage" \
            --argjson deb "$deb" --argjson rpm "$rpm" --argjson nsis "$nsis" --argjson msi "$msi" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": $mac_arm, "darwin-aarch64-app": $mac_arm,
              "darwin-x86_64": $mac_x64, "darwin-x86_64-app": $mac_x64,
              "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage,
              "linux-x86_64-deb": $deb, "linux-x86_64-rpm": $rpm,
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi
            }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

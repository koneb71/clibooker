name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            crates: --workspace
            experimental: false
          - name: Linux
            os: ubuntu-24.04
            crates: --workspace
            experimental: false
          - name: Windows
            os: windows-latest
            crates: --workspace
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev openssh-server zsh

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

      # The app crate needs the bk sidecar binary at compile time.
      - name: Sidecar
        working-directory: app
        run: node scripts/prepare-sidecar.mjs debug

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy ${{ matrix.crates }} --all-targets -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.crates }}

[package]
name = "clibooker-app"
version = "0.1.0"
description = "Clibooker: bookmark commands with their folder and Python env"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "clibooker_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bk-core = { version = "0.1.0", path = "../../crates/bk-core" }
anyhow = "1.0.104"
portable-pty = "0.9.0"
notify = "8.2.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.6.0"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

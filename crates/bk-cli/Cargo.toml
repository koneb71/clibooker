[package]
default-run = "bk"
name = "bk-cli"
version = "0.1.0"
edition = "2024"
description = "bk: bookmark shell commands with their folder, Python env and runtimes"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
bk-core = { version = "0.1.0", path = "../bk-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
ctrlc = "3.5.2"
dialoguer = "0.12.0"
libc = "0.2.190"
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "bk"
path = "src/main.rs"

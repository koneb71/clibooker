[package]
name = "bk-core"
version = "0.1.0"
edition = "2024"
description = "Shared logic for Clibooker and the bk CLI: bookmarks, envs, runs and SSH"
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The in-process fake Telegram Bot API, for other crates' tests.
fake-telegram = []

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
dotenvy = "0.15.7"
dunce = "1"
flate2 = "1.1.10"
gethostname = "1.1.0"
getrandom = "0.3"
jiff = "0.2.38"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
shell-escape = "0.1.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = "3"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
